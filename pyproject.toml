[project]
name = "agent-driven-py-project"
version = "0.1.0"
description = "Agent-driven Python project developed by an OpenCode agent inside an OpenShell sandbox"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
agent-driven-py = "agent_driven_py_project:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
